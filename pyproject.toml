[project]
name = "moteval"
version = "0.1.0"
description = "MOT evaluation library: a from-scratch TrackEval rewrite producing bit-identical numbers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2",
    "scipy>=1.11",
    "pycocotools>=2.0.7",
]

[project.scripts]
moteval = "moteval.cli:main"

[dependency-groups]
dev = [
    "prek>=0.4.10",
    "pyrefly>=1.3.2,<2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moteval"]

[tool.hatch.build.targets.sdist]
include = ["/moteval", "/README.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyrefly]
project-includes = ["moteval", "scripts", "tests"]
# Check against the requires-python floor, not whichever interpreter is on PATH.
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = [
    "network: opt-in test that downloads real data",
    "real_data: slow real-data parity gate; run with `just test-real`",
]
