[project]
name = "moteval"
version = "0.1.0"
description = "MOT evaluation library: a from-scratch TrackEval rewrite producing bit-identical numbers."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy>=2",
]

[project.scripts]
moteval = "moteval._moteval:main"

[dependency-groups]
dev = [
    "prek>=0.4.10",
    "pycocotools>=2.0.7",
    "pyrefly>=1.3.2,<2",
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.11",
]

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "moteval._moteval"
features = ["python"]
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyrefly]
project-includes = ["moteval", "scripts", "tests"]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = [
    "network: opt-in test that downloads real data",
    "real_data: slow real-data gate (parity and raw-GT loader checks); run with `mise run test-real`",
]
