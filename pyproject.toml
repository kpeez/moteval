[project]
name = "moteval"
version = "0.1.0"
description = "MOT evaluation library: a from-scratch TrackEval rewrite producing bit-identical numbers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2",
]

[project.scripts]
# The Rust CLI (rust/moteval/src/cli.rs), the same one the `moteval` binary runs.
moteval = "moteval._moteval:main"

[dependency-groups]
dev = [
    "prek>=0.4.10",
    # Test helpers (tests/rle.py, tests/perturb.py) and the dump scripts in rust/scripts.
    "pycocotools>=2.0.7",
    "pyrefly>=1.3.2,<2",
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.11",
]

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

# The `moteval` package plus the PyO3 extension `moteval._moteval`, built from the Rust
# workspace in `rust/` (see rust/README.md).
[tool.maturin]
manifest-path = "rust/moteval-py/Cargo.toml"
module-name = "moteval._moteval"
strip = true

[tool.uv]
# Rebuild the editable install's extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/*/Cargo.toml" },
    { file = "rust/*/src/**/*.rs" },
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyrefly]
project-includes = ["moteval", "scripts", "tests", "rust/scripts"]
# Check against the requires-python floor, not whichever interpreter is on PATH.
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = [
    "network: opt-in test that downloads real data",
    "real_data: slow real-data gate (parity and raw-GT loader checks); run with `mise run test-real`",
]
