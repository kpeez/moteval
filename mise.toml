[tasks.install]
description = "Sync the locked venv; install git hooks in the main checkout only"
run = [
  "uv sync --locked",
  'if [ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ]; then uv run prek install; else echo "skipping hook install in a worktree: it shares .git/hooks"; fi',
]

[tasks.check]
description = "ruff format, ruff check --fix, pyrefly check"
run = [
  "uv run ruff format .",
  "uv run ruff check --fix .",
  "uv run pyrefly check",
]

[tasks.test]
description = "pytest (real-data gate deselected)"
run = "uv run pytest"

[tasks.test-real]
description = "Slow real-data gate: parity + raw-GT loader checks (needs MOTEVAL_DATA_ROOT)"
run = "uv run pytest -m real_data"
