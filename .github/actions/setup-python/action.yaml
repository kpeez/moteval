name: "Setup Python Environment"
description: "Install uv and the pinned Rust toolchain, then sync the locked environment for one Python version"

inputs:
  python-version:
    description: "Python version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install Rust from rust-toolchain.toml
      shell: bash
      run: rustup toolchain install

    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
