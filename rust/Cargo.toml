[workspace]
resolver = "3"
members = ["moteval", "moteval-py"]
# `cargo test` and `cargo build` cover the pure-Rust crate only; the PyO3 crate needs a
# Python interpreter and is built by maturin (CI checks it with `--workspace`).
default-members = ["moteval"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
