[package]
name = "moteval-py"
description = "PyO3 bindings that back the moteval Python package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_moteval"
crate-type = ["cdylib"]
# The extension module links against the interpreter that loads it; it has no Rust tests.
test = false
doctest = false

[dependencies]
moteval = { path = "../moteval" }
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
